<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ProteoPipe by Mk tech</title>
  <!-- Tailwind CSS & Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@600;700&display=swap">
  
  <!-- Bio & Spreadsheet Engines -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/3Dmol/2.0.4/3Dmol-min.js"></script>

  <style>
    body {
      font-family: 'Californian FB', 'Playfair Display', Georgia, serif;
      background-color: #050507;
      color: #F3F3F5;
    }
    .peach-glow {
      text-shadow: 0 0 18px rgba(255, 176, 133, 0.45);
    }
    .box-peach-glow {
      box-shadow: 0 0 25px rgba(255, 176, 133, 0.12);
      border: 1px solid rgba(255, 176, 133, 0.25);
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(255, 176, 133, 0.3);
      border-radius: 3px;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-[#FFB085] selection:text-black">

  <!-- Top Navigation Bar -->
  <header class="border-b border-[rgba(255,176,133,0.15)] bg-[#090A0E] px-8 py-4 flex items-center justify-between sticky top-0 z-50">
    <div>
      <h1 class="text-3xl font-bold tracking-wider text-[#FFB085] peach-glow">ProteoPipe</h1>
      <p class="text-xs italic text-[#D8B4A6] tracking-wide mt-[-2px]">by Mk tech</p>
    </div>
    <div class="flex items-center space-x-6">
      <div class="flex items-center space-x-2 text-xs border border-[rgba(255,176,133,0.25)] rounded-full px-3 py-1 bg-[#111319]">
        <span class="w-2 h-2 rounded-full bg-[#FFB085] animate-pulse"></span>
        <span class="text-[#FFB085]">AI Deep Search Active</span>
      </div>
    </div>
  </header>

  <!-- PAGE 1: Upload & Live Ingestion -->
  <main id="upload-view" class="flex-1 flex flex-col items-center justify-center p-6">
    <div class="max-w-2xl w-full text-center space-y-6">
      <div class="space-y-2">
        <h2 class="text-4xl text-[#FFB085] font-semibold tracking-wide">Protein Database Pipeline</h2>
        <p class="text-[#D8B4A6] text-sm">Upload multi-omics datasets, CPTAC matrices, or proteomic archives for autonomous annotation and rubric scoring.</p>
      </div>

      <!-- Native HTML Label Dropzone (Guaranteed native file picker opening) -->
      <label for="file-input" id="dropzone" class="box-peach-glow bg-[#0E1017] rounded-2xl p-10 flex flex-col items-center justify-center cursor-pointer transition hover:border-[#FFB085] group border-2 border-dashed border-[rgba(255,176,133,0.3)] block relative">
        <!-- Native File Input positioned safely inside label -->
        <input type="file" id="file-input" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full z-10" />
        
        <!-- Inline Upload Cloud SVG (No external CDN dependency) -->
        <div class="w-16 h-16 rounded-full bg-[#1A1D27] flex items-center justify-center mb-4 group-hover:scale-105 transition pointer-events-none">
          <svg class="w-8 h-8 text-[#FFB085]" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke
